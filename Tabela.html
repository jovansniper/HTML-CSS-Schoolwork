<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table for generations for GPUs</title>
</head>
<body>
  <h1>Generations of GPUs</h1>
  <table border="10">
    <thead>
      <tr>
        <th>Tier</th>
        <th>30 Series</th>
        <th>40 Series</th>
        <th>50 Series</th>
      </tr>
    </thead>
    <tbody>
      <tr>
      <td rowspan="2">High-end</td>
      <td>RTX 3080</td>
      <td>RTX 4080</td>
      <td>RTX 5080</td>
      </tr>
      <tr>
        <td>RTX 3070</td>
        <td>RTX 4070</td>
        <td>RTX 5070</td>
      </tr>
      <tr>
        <td>Mid-range</td>
        <td>RTX 3060</td>
        <td>RTX 4060</td>
        <td>RTX 5060</td>
      </tr>
      <tr>
        <td colspan="4">Budget Series: RTX 2060 / RTX 3060 / RTX 4060</td>
      </tr>
    </tbody>
  </table>
  
</body>
</html>
