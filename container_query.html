<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .strana {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 10px;
    }
    .kutija {
      container-type: inline-size;
    }
    .karticka .karticka {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 10px;
      background-color: lightblue;
      border: 2px solid lightseagreen;
    }
    @container (min-width: 400px) {
      .karticka {
        flex-direction: row;
      }
      .slika {
        width: 130px;
        background-color: aquamarine;
      }
    }
  </style>
</head>
<body>
  <div class="strana">
    <div class="kutija">
      <div class="karticka">
        <div class="slika">Slika</div>
        <div class="naslov">Naslov</div>
        <div class="tekst">Nekoj kratok tekst</div>
      </div>
    </div>
    <div class="kutija">
      <div class="karticka">
        <div class="slika">Slika</div>
        <div class="naslov">Naslov</div>
        <div class="tekst">Nekoj kratok tekst</div>
    </div>
  </div>
  </div>
</body>
</html>
