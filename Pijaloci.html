<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пијалоци</title>
  <link rel="stylesheet" href="Pijaloci.css">
</head>
<body>
  <h1>Di-caprio</h1>
  <p>Кафулето не е ништо посбено, ама е <strong>тивко</strong></p>
  <ul>
    <li>Капучино</li>
    <li>Цевитана</li>
    <li>Кока-кола</li>
    <li><a href="https://www.olivemagazine.com/recipes/cocktails-and-drinks/macchiato/">Домашно макијато</a></li>
  </ul>
   <table border="1">
    <thead>
      <tr>
      <th colspan="2">Пијалаци & Цени</th>
    </tr>
    </thead>
    <tbody>
      <tr>
      <td class="istaknato">Цевитана</td>
      <td>50 ДЕН.</td>
    </tr>
    <tr>
      <Td>Капучино</Td>
      <td>110 ДЕН.</td>
    </tr>
    <tr>
      <td>Кока-кола</td>
      <Td>70 ДЕН.</Td>
    </tr>
    </tbody>
  </table>
  <form>
    <label for="name">Име</label>
    <input type="text" id="name" name="name" required>
    
    <br><br>

    <fieldset>
      <Legend>Одбери големина</Legend>
      <input type="radio" id="Мало" name="Големина" value="Мало">
      <label for="Мало">Мало</label>
      <Br>
        <input type="radio" id="Големи" name="Големина" value="Големо">
        <label for="Големо">Големо</label>
    </fieldset>
    <br>
    <button type="submit">Готово</button>
  </form>
</body> 
</html>
